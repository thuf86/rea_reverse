name: Sincronizar REA oficial

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: write

concurrency:
  group: rea-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do espelho
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Clonar fonte oficial
        run: |
          git clone --depth 1 https://github.com/morluto/rea.git /tmp/rea-source
          rm -rf upstream
          mkdir upstream
          cp -a /tmp/rea-source/. upstream/
          rm -rf upstream/.git
          git -C /tmp/rea-source rev-parse HEAD > upstream/SOURCE_COMMIT.txt
      - name: Commit e publicação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A upstream
          if git diff --cached --quiet; then
            echo "Sem atualizações."
          else
            git commit -m "chore: sincroniza REA oficial"
            git push origin HEAD:main
          fi
